<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Hema ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Poppins,sans-serif;
background:linear-gradient(135deg,#ff5e8a,#ff9fb2,#ffd6e0);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.card{
width:360px;
padding:25px;
text-align:center;
background:rgba(255,255,255,.18);
backdrop-filter:blur(15px);
border-radius:20px;
color:white;
box-shadow:0 10px 30px rgba(0,0,0,.3);
animation:fade 1s;
z-index:2;
}

img{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
border:5px solid white;
box-shadow:0 0 20px rgba(255,255,255,.6);
margin-bottom:20px;
}

h1{
font-family:'Dancing Script',cursive;
font-size:48px;
margin-bottom:10px;
}

p{
line-height:1.7;
margin:15px 0;
}

button{
padding:12px 28px;
border:none;
border-radius:40px;
background:white;
color:#ff3f73;
font-weight:bold;
cursor:pointer;
font-size:16px;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

#message{
display:none;
}

.heart{
position:absolute;
color:white;
font-size:25px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:1;
}
100%{
transform:translateY(-20vh);
opacity:0;
}
}

@keyframes fade{
from{
opacity:0;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1);
}
}
</style>
</head>

<body>

<div class="card">

<div id="welcome">

<img src="hema.jpg">

<h1>🎁 A Surprise</h1>

<p>Click below ❤️</p>

<button onclick="showWish()">Open Gift ❤️</button>

</div>

<div id="message">

<img src="hema.jpg">

<h1>Happy Birthday Hema ❤️</h1>

<p>
May your smile always shine brighter than the stars. ✨<br><br>

Thank you for being the most beautiful part of my life.

I pray that every dream of yours comes true.

Stay happy, stay blessed, and always keep smiling.

❤️ I Love You ❤️
</p>

</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

</div>

<script>

function showWish(){

document.getElementById("welcome").style.display="none";
document.getElementById("message").style.display="block";

document.getElementById("music").play();

for(let i=0;i<80;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML=Math.random()>0.5?"❤️":"✨";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(18+Math.random()*20)+"px";

h.style.animationDuration=(4+Math.random()*3)+"s";

document.body.appendChild(h);

setTimeout(()=>h.remove(),7000);

}

}

setInterval(()=>{

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration="6s";

document.body.appendChild(h);

setTimeout(()=>h.remove(),6000);

},500);

</script>

</body>
</html>
